workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Install Gradle 9.3.1
        script: |
          curl -L https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-9.3.1/bin:$PATH"
          gradle --version

      - name: Build APK
        script: |
          export PATH="/tmp/gradle-9.3.1/bin:$PATH"
          gradle assembleDebug --no-configuration-cache

    artifacts:
      - app/build/outputs/**/*.apk
