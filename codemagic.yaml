workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: linux_x2

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Check Gradle
        script: |
          gradle --version

      - name: Build APK
        script: |
          gradle assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
